[package]
name = "libr"
version = "0.1.0"
description = "A portable cross-platform asset library"
authors = ["Libr Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "libr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "blob", "backup", "modern_sqlite"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
mime_guess = "2"
walkdir = "2"
parking_lot = "0.12"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
opener = "0.8"

[dev-dependencies]
tempfile = "3"
