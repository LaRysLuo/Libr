name: Release Libr

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/windows-signing.conf.json
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify version matches tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Require release signing secrets
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -z "$APPLE_CERTIFICATE" ]; then
              echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
              echo "Apple signing secrets are absent; using ad-hoc signing."
            else
              test -n "$APPLE_CERTIFICATE_PASSWORD"
              test -n "$APPLE_SIGNING_IDENTITY"
              test -n "$APPLE_ID"
              test -n "$APPLE_PASSWORD"
              test -n "$APPLE_TEAM_ID"
            fi
          fi
      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "{}" | Set-Content src-tauri/windows-signing.conf.json
            Write-Host "Windows signing secrets are absent; publishing without Authenticode."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is set."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "libr-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content src-tauri/windows-signing.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Libr ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

  finalize-updater-json:
    needs: publish
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish custom universal updater target
        run: |
          mkdir updater
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir updater
          jq '.platforms["darwin-universal"] = (.platforms["darwin-universal"] // .platforms["darwin-aarch64"] // .platforms["darwin-x86_64"]) | del(.platforms["darwin-aarch64"], .platforms["darwin-x86_64"])' updater/latest.json > updater/latest.final.json
          mv updater/latest.final.json updater/latest.json
          gh release upload "$GITHUB_REF_NAME" updater/latest.json --repo "$GITHUB_REPOSITORY" --clobber
