name: Release Libr

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and update
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/windows-signing.conf.json
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify version matches tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$RELEASE_TAG"
      - name: Require updater signing secret
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RELEASE_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RELEASE_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RELEASE_APPLE_ID: ${{ secrets.APPLE_ID }}
          RELEASE_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          RELEASE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$RELEASE_APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "Apple signing secrets are absent; using ad-hoc signing."
            exit 0
          fi
          test -n "$RELEASE_APPLE_CERTIFICATE_PASSWORD"
          test -n "$RELEASE_APPLE_SIGNING_IDENTITY"
          test -n "$RELEASE_APPLE_ID"
          test -n "$RELEASE_APPLE_PASSWORD"
          test -n "$RELEASE_APPLE_TEAM_ID"
          echo "APPLE_CERTIFICATE=$RELEASE_APPLE_CERTIFICATE" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$RELEASE_APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$RELEASE_APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$RELEASE_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$RELEASE_APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$RELEASE_APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "{}" | Set-Content src-tauri/windows-signing.conf.json
            Write-Host "Windows signing secrets are absent; publishing without Authenticode."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is set."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "libr-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content src-tauri/windows-signing.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Libr ${{ env.RELEASE_TAG }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  finalize-updater-json:
    needs: publish
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish custom universal updater target
        run: |
          mkdir updater
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir updater
          jq '.platforms["darwin-universal"] = (.platforms["darwin-universal"] // .platforms["darwin-aarch64"] // .platforms["darwin-x86_64"]) | del(.platforms["darwin-aarch64"], .platforms["darwin-x86_64"])' updater/latest.json > updater/latest.final.json
          mv updater/latest.final.json updater/latest.json
          gh release upload "$RELEASE_TAG" updater/latest.json --repo "$GITHUB_REPOSITORY" --clobber
